<!DOCTYPE html>
<html>
<head>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #ffffff;
  }
  .logo-container {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .icon {
    width: 90px;
    height: 90px;
    background-color: #1f2233;
    border-radius: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ffd66b;
    font-size: 60px;
    font-weight: bold;
  }
  .text-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .title {
    font-size: 65px;
    font-weight: 800;
    color: #1f2233;
    line-height: 1;
    letter-spacing: -1px;
  }
  .subtitle {
    font-size: 32px;
    font-weight: 600;
    color: #22a06b; /* Green color matching your reference image */
    margin-top: 4px;
  }
</style>
</head>
<body>

  <div class="logo-container">
    <div class="icon">₹</div>
    <div class="text-container">
      <div class="title">Moneo</div>
      <div class="subtitle">Smart Expense Tracker</div>
    </div>
  </div>

</body>
</html>
